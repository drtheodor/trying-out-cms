<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<link href="./config.yml" type="text/yaml" rel="cms-config-url" />
		<title>Content Manager</title>
		<style>
			/* Fix cursor */
			.app-shell p,
			.app-shell h1,
			.app-shell h2,
			.app-shell h3,
			.app-shell h4,
			.app-shell h5,
			.app-shell h5 {
				cursor: auto !important;
				user-select: text !important;
			}
			/* Improve scrollbar layout */
			::-webkit-scrollbar-track {
				border: none;
				background-color: transparent;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
				background-color: transparent;
			}
			::-webkit-scrollbar-thumb {
				background-color: #2c3337;
				border-radius: 2px;
			}
			::-webkit-scrollbar-thumb:hover {
				background-color: #576b77;
			}
			/* Scrollbar layout Dark theme */
			[data-theme='dark'] ::-webkit-scrollbar-thumb {
				background-color: #b6b6b6;
			}
			[data-theme='dark'] ::-webkit-scrollbar-thumb:hover {
				background-color: white;
			}
			/* Improve sidebar width */
			.secondary-sidebar {
				min-width: 340px;
			}
		</style>
	</head>
	<body>
		<script is:inline src="https://unpkg.com/@sveltia/cms@0.116.0/dist/sveltia-cms.js"></script>
		<style>
			:root {
				--sui-base-hue: 35;
			}
		</style>
		<script>
			CMS.registerEditorComponent({
    id: "gist",
    label: "Gist",
    fields: [{
            name: "username",
            label: "GitHub Username",
            widget: "string"
        },
        {
            name: "gid",
            label: "Gist ID",
            widget: "string"
        },
    ],
    pattern: /^{{< gist ([a-zA-Z0-9]+) ([a-zA-Z0-9]+) >}}/,
    fromBlock: function(match) {
        return {
            username: match[1],
            gid: match[2],
        };
    },
    toBlock: function(obj) {
        return `{{< gist ${obj.username} ${obj.gid} >}}`;
    },
    toPreview: function(obj) {
        return '<a href="https://gist.github.com/' + obj.username + '/' + obj.id + '">gist</a>';
    },
});
		</script>
		<script>
var CategoriesControl = createClass({
  handleChange: function(e) {
    const separator = this.props.field.get('separator', ', ')
    this.props.onChange(e.target.value.split(separator).map((e) => e.trim()));
  },

  render: function() {
    const separator = this.props.field.get('separator', ', ');
    var value = this.props.value;
    return h('input', {
      id: this.props.forID,
      className: this.props.classNameWrapper,
      type: 'text',
      value: value ? value.join(separator) : '',
      onChange: this.handleChange,
    });
  },
});

var CategoriesPreview = createClass({
  render: function() {
    return h('ul', {},
      this.props.value.map(function(val, index) {
        return h('li', {key: index}, val);
      })
    );
  }
});

var schema = {
  properties: {
    separator: { type: 'string' },
  },
}

CMS.registerWidget('categories', CategoriesControl, CategoriesPreview, schema);
</script>
	</body>
</html>
