# ================================
# Backend Configuration
# ================================
backend:
  name: github
  repo: drtheodor/trying-out-cms
  branch: main
  base_url: https://sveltia-cms-auth.drtheo.workers.dev/

# ================================
# Global Media Settings (Overridden per collection)
# ================================
media_folder: "static/global_media"
public_folder: "/global_media"

# ================================
# Collections
# ================================
collections:
  # -------------------------------------------------
  # 1. CATEGORY MAIN PAGES (creates index.md)
  # -------------------------------------------------
  - name: wiki_categories
    label: "📁 Category Pages"
    label_singular: "Category Index"
    folder: wiki
    create: true
    # 👇 Forces filename to be "index.md"
    path: "{{section}}/index"
    media_folder: ""
    public_folder: ""
    
    summary: "📂 {{section}}/ (Category Landing)"
    
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        
      - label: "Section (Folder)"
        name: "section"
        widget: "string"
        hint: "Enter folder name (e.g., getting-started, tutorials, api). This creates or selects the folder."
        pattern: ['^[a-z0-9-]+$', "Use lowercase letters, numbers, and hyphens only."]
        
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        
      - label: "Content"
        name: "body"
        widget: "markdown"
        hint: "This page will be the index of the category folder."

  # -------------------------------------------------
  # 2. REGULAR WIKI PAGES (creates slug.md)
  # -------------------------------------------------
  - name: wiki_pages
    label: "📄 Wiki Pages"
    label_singular: "Wiki Page"
    folder: wiki
    create: true
    # 👇 Creates a standard .md file inside the chosen folder
    path: "{{section}}/{{slug}}.md"
    media_folder: ""
    public_folder: ""
    
    summary: "📄 {{section}}/{{slug}}"
    view_filters:
      - label: "Section"
        field: "section"
    
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        
      - name: 'section'
        widget: 'relation'
        collection: 'wiki_categories'
        value_field: '{{section}}'
        search_fields: ['title']
        display_fields: ['title']
        multiple: false
        i18n: 'duplicate'
        dropdown_threshold: 0
        
      - label: "Body"
        name: "body"
        widget: "markdown"
